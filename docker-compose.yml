services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: pgdb, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  app:
    build: .
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, mongo: { condition: service_started } }
    environment:
      DB_HOST: postgres
      MONGODB_URI: mongodb://mongo:27017/pgdb
      JWT_SECRET: local-dev-secret-key-at-least-32-bytes-long-123
volumes: { pgdata: {}, mongodata: {} }
