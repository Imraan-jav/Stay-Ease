# Render Blueprint: Docker web service + managed PostgreSQL.
# MongoDB is not offered by Render: create a free MongoDB Atlas cluster and paste its URI into MONGODB_URI.
services:
  - type: web
    name: pg-management
    runtime: docker
    plan: free
    envVars:
      - { key: DB_HOST, fromDatabase: { name: pg-db, property: host } }
      - { key: DB_PORT, fromDatabase: { name: pg-db, property: port } }
      - { key: DB_NAME, fromDatabase: { name: pg-db, property: database } }
      - { key: DB_USER, fromDatabase: { name: pg-db, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: pg-db, property: password } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: MONGODB_URI, sync: false }
databases:
  - name: pg-db
    plan: free
    databaseName: pgdb
    user: pguser
