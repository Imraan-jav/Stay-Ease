server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pgdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pgdb?serverSelectionTimeoutMS=2000}
app.jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-bytes-long!!}
app.jwt.expiry-minutes=480
app.admin.email=${ADMIN_EMAIL:admin@pg.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo=${SEED_DEMO:true}
app.late-fee-per-day=20
